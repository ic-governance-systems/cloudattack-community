name: CloudAttack Community
description: Find potential AWS IAM identity-risk patterns in a Terraform plan

inputs:
  terraform-plan:
    description: Path to an existing Terraform plan JSON file produced by terraform show -json
    required: true
  fail-on:
    description: Finding severity threshold that causes the action to exit with failure
    required: false
    default: high
  format:
    description: Report format written to the workspace (text, json, or sarif)
    required: false
    default: sarif
  scan-id:
    description: Optional caller-supplied identifier for this scan execution
    required: false
  repository:
    description: Optional repository identifier to include in scan provenance
    required: false
  commit-sha:
    description: Optional commit SHA to include in scan provenance
    required: false
  git-ref:
    description: Optional Git reference to include in scan provenance
    required: false
  pull-request:
    description: Optional pull request number to include in scan provenance
    required: false

outputs:
  report-file:
    description: Path to the generated CloudAttack report
    value: ${{ steps.scan.outputs.report_file }}
  exit-code:
    description: Original CloudAttack CLI exit code
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Build CloudAttack CLI
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$RUNNER_TEMP/cloudattack-community" ./cmd/cloudattack

    - name: Run CloudAttack
      id: scan
      shell: bash
      env:
        PLAN_PATH: ${{ inputs.terraform-plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
        SCAN_ID: ${{ inputs.scan-id }}
        REPOSITORY: ${{ inputs.repository }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        GIT_REF: ${{ inputs.git-ref }}
        PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        set -u
        case "$FORMAT" in
          text)  report_file="$GITHUB_WORKSPACE/cloudattack.txt" ;;
          json)  report_file="$GITHUB_WORKSPACE/cloudattack.json" ;;
          sarif) report_file="$GITHUB_WORKSPACE/cloudattack.sarif" ;;
          *)     report_file="$GITHUB_WORKSPACE/cloudattack.invalid" ;;
        esac

        set +e
        provenance_args=()
        [[ -n "$SCAN_ID" ]] && provenance_args+=(--scan-id "$SCAN_ID")
        [[ -n "$REPOSITORY" ]] && provenance_args+=(--repository "$REPOSITORY")
        [[ -n "$COMMIT_SHA" ]] && provenance_args+=(--commit-sha "$COMMIT_SHA")
        [[ -n "$GIT_REF" ]] && provenance_args+=(--git-ref "$GIT_REF")
        [[ -n "$PULL_REQUEST" ]] && provenance_args+=(--pull-request "$PULL_REQUEST")
        "$RUNNER_TEMP/cloudattack-community" scan \
          --terraform-plan "$PLAN_PATH" \
          --format "$FORMAT" \
          --fail-on "$FAIL_ON" \
          "${provenance_args[@]}" > "$report_file"
        status=$?
        echo "report_file=$report_file" >> "$GITHUB_OUTPUT"
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
